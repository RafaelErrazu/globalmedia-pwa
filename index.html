<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A73E8">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1H00HMLcLhIkdOQ-7TJWc6iOSohUuUrfj&sz=w192">
  <title>GlobalMedia Hub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',sans-serif;
      background:#1A73E8;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      height:100vh;color:#fff;text-align:center;padding:24px;
    }
    svg{width:80px;height:80px;margin-bottom:24px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
    h1{font-size:26px;font-weight:700;margin-bottom:8px}
    p{font-size:14px;opacity:.85;margin-bottom:32px}
    a{
      background:#fff;color:#1A73E8;
      text-decoration:none;font-weight:700;font-size:15px;
      padding:14px 32px;border-radius:100px;
      box-shadow:0 4px 18px rgba(0,0,0,.2);
      display:inline-block;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="18" cy="18" r="17" fill="white" stroke="#1A73E8" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="11.5" fill="#1A73E8"/>
    <path d="M7.5 15 Q13 12 18 12 Q23 12 28.5 15" stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M7.5 21 Q13 24 18 24 Q23 24 28.5 21" stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M6.5 18 Q12 16 18 16 Q24 16 29.5 18" stroke="white" stroke-width="1.1" fill="none"/>
    <path d="M18 6.5 Q14 10 13.5 18 Q13 24 15 29" stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M18 6.5 Q22 10 22.5 18 Q23 24 21 29" stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <line x1="18" y1="6.5" x2="18" y2="29.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <circle cx="13.5" cy="13.5" r="1.2" fill="white"/>
    <circle cx="22.5" cy="13.5" r="1.2" fill="white"/>
    <circle cx="11.5" cy="19.5" r="1.2" fill="white"/>
    <circle cx="24.5" cy="19.5" r="1.2" fill="white"/>
    <circle cx="18" cy="11" r="1.3" fill="white"/>
  </svg>
  <h1>GlobalMedia Hub</h1>
  <p>Sistema de gestión de premios 2026</p>
  <a href="https://script.google.com/macros/s/AKfycbzTjw_kc8H2mKxIClVTHl0LNGEl6Mnu1P_CjkO88pNVT7lM3nbHMbFrI3GY5jv8ACAN/exec">Abrir sistema</a>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    // Redirige automáticamente después de 1.5s
    setTimeout(() => {
      window.location.href = 'https://script.google.com/macros/s/AKfycbzTjw_kc8H2mKxIClVTHl0LNGEl6Mnu1P_CjkO88pNVT7lM3nbHMbFrI3GY5jv8ACAN/exec';
    }, 1500);
  </script>
</body>
</html>
